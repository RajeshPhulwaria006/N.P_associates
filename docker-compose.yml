services:
  # Express Backend API
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: np_associates_server
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET:-a_secure_long_random_session_secret_for_np_associates_32chars}
      - BUSINESS_PHONE=${BUSINESS_PHONE:-7728956389}
      - BUSINESS_WHATSAPP=${BUSINESS_WHATSAPP:-7728956389}

  # React Frontend (Nginx SPA + Reverse Proxy)
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: np_associates_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
      