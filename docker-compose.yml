services:
  # Express Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: np_associates_server
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://phulwariarajesh152_db_user:c4LV7m2pxiE6Pa2J@cluster0.uoieiwu.mongodb.net/np_associates?retryWrites=true&w=majority}
      - SESSION_SECRET=${SESSION_SECRET:-a_secure_long_random_session_secret_for_np_associates_32chars}
      - BUSINESS_PHONE=${BUSINESS_PHONE:-7728956389}
      - BUSINESS_WHATSAPP=${BUSINESS_WHATSAPP:-7728956389}

  # React Frontend (Nginx SPA + Reverse Proxy)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: np_associates_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
